# PREP-1, PREP-2, MOCK-1, MOCK-2, MOCK-5 with the real on-device model.
appId: dev.kristinadarroch.applicationtracker
---
- runFlow: launch.yaml
- tapOn: Open settings
- tapOn: Load demo data
- tapOn:
    text: Back
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: Your applications
    timeout: 10000
# Open Acme from its application row (the cards above also name Acme but aren't the row).
- scrollUntilVisible:
    element: '.*Acme Health.*Interviewing.*'
- tapOn: '.*Acme Health.*Interviewing.*'
- extendedWaitUntil:
    visible: Edit application
    timeout: 10000
- scrollUntilVisible:
    element: Prep questions
# PREP-1: questions generate on their own when the screen opens; no Generate step
- tapOn: Prep questions
- extendedWaitUntil:
    visible: '.*practiced.*'
    timeout: 90000
- takeScreenshot: e2e/artifacts/prep-01-questions
# PREP-2: mark the first behavioral question practiced
# Right after the questions arrive, the first tap sometimes doesn't register (cause not found;
# see docs/verification.md). Tap once more if the count didn't move.
- tapOn:
    id: prep-question
    index: 0
- runFlow:
    when:
      notVisible: '1 / .* practiced'
    commands:
      - waitForAnimationToEnd
      - tapOn:
          id: prep-question
          index: 0
- extendedWaitUntil:
    visible: '1 / .* practiced'
    timeout: 5000
- tapOn: Back
# MOCK-1 / MOCK-2
- scrollUntilVisible:
    element: Mock interview
# MOCK-1: the first question is asked on open; no Start step
- tapOn: Mock interview
- extendedWaitUntil:
    visible: Your answer
    timeout: 90000
- takeScreenshot: e2e/artifacts/prep-02-first-question
- tapOn:
    text: Your answer
    index: 1
- inputText: 'At my last role I led a migration of our React Native component library to TypeScript. I planned it in phases, added type tests, and we cut UI bugs by a third over two releases.'
- tapOn: Submit answer
- extendedWaitUntil:
    visible: Strengths
    timeout: 90000
- assertVisible: Gaps
- takeScreenshot: e2e/artifacts/prep-03-feedback
# MOCK-5
- waitForAnimationToEnd
- tapOn:
    text: End
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*questions answered.*'
    timeout: 10000
- takeScreenshot: e2e/artifacts/prep-04-summary
# Prep-first home: the Next interview card shows this progress and opens both prep screens
- openLink: applicationtracker://
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
# Home keeps its scroll position, so scroll back up to the card.
- scrollUntilVisible:
    element: Next interview
    direction: UP
    timeout: 20000
- assertVisible: '1 of .* questions practiced · 1 mock interview'
- takeScreenshot: e2e/artifacts/prep-05-home
- tapOn: Practice questions
- extendedWaitUntil:
    visible: '1 / .* practiced'
    timeout: 10000
- tapOn: Back
- extendedWaitUntil:
    visible: Next interview
    timeout: 10000
- tapOn: Mock interview
- extendedWaitUntil:
    visible: Your answer
    timeout: 90000
- takeScreenshot: e2e/artifacts/prep-06-mock-from-home
