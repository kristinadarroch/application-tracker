# Prompt and reliability checks on the real on-device model. Each group runs in a fresh launch and must report 0 failed.
appId: dev.kristinadarroch.applicationtracker
---
- runFlow:
    file: ai-checks-group.yaml
    env:
      GROUP_BUTTON: Check listings
      GROUP: listings
- runFlow:
    file: ai-checks-group.yaml
    env:
      GROUP_BUTTON: Check triage
      GROUP: triage
- runFlow:
    file: ai-checks-group.yaml
    env:
      GROUP_BUTTON: Check prep
      GROUP: prep
