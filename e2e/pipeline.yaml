# PIPE-1..6, UX-1 on a real build. No AI involved.
appId: dev.kristinadarroch.applicationtracker
---
- runFlow: launch.yaml
- assertVisible: No applications yet # PIPE-1 empty state

# UX-1 / demo data
- tapOn: Open settings
- tapOn: Load demo data
- tapOn: Dark
- takeScreenshot: e2e/artifacts/pipeline-01-settings-dark
- tapOn: System
- tapOn:
    text: Back
    retryTapIfNoChange: true

# Prep-first home: the next interview leads, with its prep shortcuts
- extendedWaitUntil:
    visible: Next interview
    timeout: 10000
- assertVisible: Practice questions
- assertVisible: '.*Due tomorrow.*'
# PIPE-1: grouped by stage (rows sit below the prep and Up next cards), PIPE-6: urgent badge
- scrollUntilVisible:
    element: '.*Globex.*Stage: Saved.*'
- scrollUntilVisible:
    element: '.*Northwind Labs.*Stage: Applied.*'
- scrollUntilVisible:
    element: '.*Acme Health.*Stage: Interviewing.*Prep: .*'
- takeScreenshot: e2e/artifacts/pipeline-02-seeded

# PIPE-2: validation, then a valid manual add
- waitForAnimationToEnd
- tapOn:
    text: Add application
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: Company
    timeout: 10000
- scrollUntilVisible:
    element: Save application
- tapOn: Save application
- scrollUntilVisible:
    element: Add the company
    direction: UP
- assertVisible: Add the company
- assertVisible: Add the role
- tapOn:
    text: Company
    index: 1
- inputText: Initech
- tapOn:
    text: Role
    index: 1
- inputText: Staff Mobile Engineer
# On Android the field can sit under the keyboard; bring it into view first.
- pressKey: Enter
- scrollUntilVisible:
    element:
      text: Listing link
      index: 1
    visibilityPercentage: 100
- tapOn:
    text: Listing link
    index: 1
- inputText: not a link
- pressKey: Enter
- scrollUntilVisible:
    element: Save application
- tapOn: Save application
- assertVisible: Enter a link that starts with http:// or https://
- scrollUntilVisible:
    element:
      text: Listing link
      index: 1
- tapOn:
    text: Listing link
    index: 1
- eraseText: 20
- pressKey: Enter
- scrollUntilVisible:
    element: Save application
- tapOn: Save application
- extendedWaitUntil:
    visible: Edit application
    timeout: 10000
- takeScreenshot: e2e/artifacts/pipeline-03-detail

# PIPE-3: move to a new stage
- waitForAnimationToEnd
- tapOn: Applied
- assertVisible: 'Stage: Applied'

# PIPE-6: add a Next Step due today, mark it done
- scrollUntilVisible:
    element: Add Next Step
- tapOn: 'e.g. Book the onsite interview'
- inputText: Send portfolio
- pressKey: Enter
- tapOn: Today
- tapOn: Add Next Step
# The new step shows under the current stage, above the form.
- scrollUntilVisible:
    element: Mark “Send portfolio” done
    direction: UP
- tapOn: Mark “Send portfolio” done
- scrollUntilVisible:
    element: Completed
- assertVisible: Completed
- takeScreenshot: e2e/artifacts/pipeline-04-next-steps

# PIPE-5: delete asks first
- scrollUntilVisible:
    element: Delete application
- tapOn: Delete application
- tapOn: Cancel
- assertVisible: Delete application
- tapOn: Delete application
- tapOn: Delete
- extendedWaitUntil:
    visible: Pipeline
    timeout: 10000
- assertNotVisible: '.*Initech.*'
- takeScreenshot: e2e/artifacts/pipeline-05-after-delete
