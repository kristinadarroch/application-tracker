# INBX-1, INBX-2, INBX-3, INBX-6 with the real on-device model.
appId: dev.kristinadarroch.applicationtracker
---
- runFlow: launch.yaml
- tapOn: Open settings
- tapOn: Load demo data
- tapOn: Back
- tapOn: 'Inbox.*'
- assertVisible: No messages yet
# INBX-6: deliver the first sample email (Acme Health interview invite)
- tapOn: Receive next email
# Wait for the finished result, not just the absence of "Analyzing" (which can pass before it starts).
- extendedWaitUntil:
    visible: '(?i).*next step proposed.*'
    timeout: 60000
- takeScreenshot: e2e/artifacts/inbox-01-triaged
- waitForAnimationToEnd
- tapOn:
    text: 'Interview invitation.*'
    retryTapIfNoChange: true
# INBX-2: proposal linked to the application, accept adds the Next Step
- extendedWaitUntil:
    visible: Proposed Next Step
    timeout: 10000
- assertVisible: '.*Acme Health.*'
- takeScreenshot: e2e/artifacts/inbox-02-proposal
- scrollUntilVisible:
    element: Accept
- tapOn: Accept
- assertVisible: '.*Next Step added.*'
- tapOn: Back
- tapOn: 'Pipeline.*'
- waitForAnimationToEnd
- scrollUntilVisible:
    element: '.*Acme Health.*Interviewing.*'
- tapOn: '.*Acme Health.*Interviewing.*'
- extendedWaitUntil:
    visible: Edit application
    timeout: 10000
# The accepted step boards under the current station (its title comes from the model, so the
# check is the board label; the unit tests cover the exact step).
- assertVisible: '(?i)next step'
- takeScreenshot: e2e/artifacts/inbox-03-step-on-application
